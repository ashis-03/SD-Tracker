{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>{{ title }}</h1>

    <form method="POST">

        {% csrf_token %}


        <!-- Team Name -->

        <div class="form-group">

            <label>Team Name</label>

            {{ form.name }}

            {% if form.name.errors %}
                <div class="error">
                    {{ form.name.errors }}
                </div>
            {% endif %}

        </div>


        <!-- Manager Dropdown -->

        <div class="form-group">

            <label>Assign Manager</label>

            {{ form.manager }}

        </div>


        <!-- Members Dropdown -->

        <div class="form-group">

            <label>Add Team Members</label>

            <div class="custom-dropdown">

                <!-- Dropdown Button -->

                <button
                    type="button"
                    class="dropdown-btn"
                    onclick="toggleMembers()"
                >

                    <span id="selected-text">
                        Select Team Members
                    </span>

                    <span>⌄</span>

                </button>


                <!-- Dropdown Content -->

                <div
                    class="dropdown-content"
                    id="members-dropdown"
                >

                    {% for checkbox in form.members %}

                    <div class="member-option">

                        {{ checkbox.tag }}

                        <label for="{{ checkbox.id_for_label }}">
                            {{ checkbox.choice_label }}
                        </label>

                    </div>

                    {% endfor %}

                </div>

            </div>

        </div>


        <!-- Buttons -->

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Team
        </button>


        <a
            href="{% url 'team_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>


<script>

function toggleMembers() {

    const dropdown =
        document.getElementById("members-dropdown");

    dropdown.classList.toggle("show");

}

</script>

{% endblock %}
